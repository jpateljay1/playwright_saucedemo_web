name: Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # This allows you to manually trigger the workflow from the GitHub UI

jobs:
  regression-tests:
    name: Run Regression Tests on ${{ matrix.browser }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # Define a matrix to run the pipeline multiple times in parallel
    strategy:
      fail-fast: false  # Ensure all browsers run even if one fails
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Playwright browsers and dependencies
      run: python -m playwright install --with-deps ${{ matrix.browser }}
      
    - name: Run Pytest
      # Using xvfb-run because your pytest.ini is configured to run tests '--headed'
      run: xvfb-run pytest --browser ${{ matrix.browser }}
      
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: report.html
        retention-days: 30
        
    - name: Upload Test Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-logs
        path: logs/
        retention-days: 30
